<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPA Business Finance Quiz</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #e3f2fd, #ffffff);
    margin: 0;
    padding: 0;
}

.container {
    max-width: 800px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    color: #0d47a1;
}

.progress-bar {
    height: 10px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #0d47a1;
    transition: 0.3s;
}

.question {
    font-size: 18px;
    margin-bottom: 15px;
    font-weight: bold;
}

.option {
    display: block;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    background: #f1f7ff;
}

.correct {
    background: #d4edda;
    border-color: #28a745;
}

.incorrect {
    background: #f8d7da;
    border-color: #dc3545;
}

.explanation {
    margin-top: 10px;
    background: #fff3cd;
    padding: 10px;
    border-left: 5px solid #ffc107;
    display: none;
}

.buttons {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #0d47a1;
    color: white;
    cursor: pointer;
}

button:disabled {
    background: #aaa;
}

#result {
    text-align: center;
    font-size: 20px;
    display: none;
}
</style>
</head>

<body>

<div class="container">
    <h1>CPA Business Finance Module 1 and 2</h1>


    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>

    <div id="quiz-box">
        <div id="question" class="question"></div>
        <div id="options"></div>
        <div id="explanation" class="explanation"></div>

        <div class="buttons">
            <button id="prevBtn">Previous</button>
            <button id="nextBtn">Next</button>
        </div>
    </div>

    <div id="result"></div>
</div>

<script>
const questions = [
    // --- MODULE 1: MARKETS & INSTITUTIONS (Questions 1-30) ---
    { q: "What is the primary role of financial markets?", options: ["A. Exchange of goods", "B. Medium for funds transfers between surplus and deficit units", "C. Regulating bank interest", "D. Ensuring company profit"], correct: 1, exp: "Financial markets link those with surplus funds to those needing funds for investment or consumption." },
    { q: "The 'Money Market' specifically deals with instruments that have a maturity of:", options: ["A. More than 5 years", "B. Exactly 10 years", "C. Up to one year", "D. 1 to 5 years"], correct: 2, exp: "Money markets are for short-term wholesale lending and borrowing, typically under 12 months." },
    { q: "Which of the following is a role of a financial intermediary?", options: ["A. Maturity transformation", "B. Risk transformation", "C. Liquidity transformation", "D. All of the above"], correct: 3, exp: "Intermediaries like banks transform short-term deposits into long-term loans, spread risk, and provide liquidity." },
    { q: "A 'Primary Market' is a market where:", options: ["A. Existing shares are traded between investors", "B. New securities are issued for the first time", "C. Only government bonds are sold", "D. Only professional traders operate"], correct: 1, exp: "The primary market is where companies and governments raise new capital by issuing new securities." },
    { q: "The Australian Securities Exchange (ASX) is an example of a:", options: ["A. Money market", "B. Primary and Secondary capital market", "C. Unofficial market", "D. Private placement market"], correct: 1, exp: "The ASX facilitates both the initial public offering (primary) and the subsequent trading (secondary) of long-term capital." },
    { q: "Which organization is responsible for the 'Prudential' regulation of the Australian financial system?", options: ["A. ASIC", "B. RBA", "C. APRA", "D. ACCC"], correct: 2, exp: "APRA oversees banks, insurance, and superannuation to ensure financial safety." },
    { q: "What is 'Marketability' (Liquidity)?", options: ["A. The total value of a company", "B. The ease with which an asset can be converted into cash without loss", "C. The interest rate on a bond", "D. Issuing new shares"], correct: 1, exp: "Liquidity refers to how quickly and easily an investor can sell a security for cash at a fair price." },
    { q: "Which market is characterized by direct negotiation between two parties?", options: ["A. ASX", "B. NYSE", "C. Over-the-counter (OTC) market", "D. Public auction market"], correct: 2, exp: "OTC markets involve direct transactions (often electronically) between two parties, like the interbank market." },
    { q: "A 'Deficit Unit' in the financial system is usually:", options: ["A. A household with high savings", "B. A corporation seeking to fund a new project", "C. A bank with excess reserves", "D. A profitable insurance company"], correct: 1, exp: "Deficit units are those whose expenditure exceeds their income and need to borrow or issue equity." },
    { q: "The 'Yield' on a financial instrument is best described as:", options: ["A. The face value of the bond", "B. The total return on the investment as a percentage", "C. The broker's commission", "D. Time until maturity"], correct: 1, exp: "Yield represents the percentage return an investor earns, accounting for interest/dividends and price changes." },
    { q: "Interest Rate Parity suggests interest rate differences are equal to:", options: ["A. Inflation differences", "B. Difference between spot and forward exchange rates", "C. GDP growth", "D. Unemployment rates"], correct: 1, exp: "IRP relates national interest rates to the premium or discount of forward exchange rates." },
    { q: "Which of the following is a secondary financial instrument (derivative)?", options: ["A. Ordinary Share", "B. Futures Contract", "C. Treasury Bond", "D. Bank Deposit"], correct: 1, exp: "A futures contract is a derivative because its value is derived from an underlying primary asset." },
    { q: "In Australia, the 'lender of last resort' is the:", options: ["A. Commonwealth Bank", "B. ASIC", "C. Reserve Bank of Australia (RBA)", "D. Federal Treasury"], correct: 2, exp: "The RBA provides liquidity to the banking system and acts as the central bank." },
    { q: "A 'Rights Issue' allows existing shareholders to:", options: ["A. Sell shares back to the company", "B. Buy new shares in proportion to their holding", "C. Vote on salaries", "D. Receive higher dividends"], correct: 1, exp: "A rights issue allows current owners to maintain their percentage of ownership." },
    { q: "What does 'Price Efficiency' mean?", options: ["A. Low prices", "B. Prices reflect all available information rapidly", "C. Constant prices", "D. Government-set prices"], correct: 1, exp: "Price efficiency means market prices quickly incorporate new information." },
    { q: "A 'Zero-Coupon Bond' is a bond that:", options: ["A. Pays no interest but sold at discount", "B. Has 0% risk", "C. Issued for 0 years", "D. Government-only"], correct: 0, exp: "Return comes from the difference between discounted purchase price and face value at maturity." },
    { q: "What is the primary purpose of 'Hedging'?", options: ["A. Speculation profit", "B. Reduce or eliminate financial risk", "C. Increase volatility", "D. Tax avoidance"], correct: 1, exp: "Hedging involves taking an offsetting position to protect against adverse price movements." },
    { q: "Which of these is a typical 'Capital Market' instrument?", options: ["A. 90-day Bank Bill", "B. 10-year Corporate Bond", "C. Commercial Paper", "D. 30-day Treasury Note"], correct: 1, exp: "Capital markets deal with long-term debt (bonds) and equity." },
    { q: "The 'Spread' in a market quote refers to:", options: ["A. Total shares", "B. Difference between bid and ask price", "C. Settlement time", "D. Geographic distribution"], correct: 1, exp: "The bid-ask spread represents a transaction cost for the investor." },
    { q: "Allocative Efficiency is achieved when:", options: ["A. Investors have equal money", "B. Funds go to the most productive projects", "C. Zero transaction costs", "D. No taxes"], correct: 1, exp: "Allocative efficiency ensures capital is used where it provides the highest utility/output." },
    { q: "The Eurobond market involves:", options: ["A. Bonds only in Euros", "B. Bonds sold in a country other than that of the currency of denomination", "C. Bonds that are illegal", "D. Local bank loans"], correct: 1, exp: "Eurobonds are issued internationally in a currency different from the country where they are sold." },
    { q: "Which is a characteristic of the 'unofficial' money market?", options: ["A. Regulated by the RBA", "B. Inter-company lending", "C. Trading on the ASX", "D. Government bonds only"], correct: 1, exp: "The unofficial market consists of direct lending between corporations." },
    { q: "Financial markets provide 'liquidity' which helps:", options: ["A. Increase taxes", "B. Reduce the cost of capital", "C. Stop share prices from changing", "D. Only the government"], correct: 1, exp: "Higher liquidity reduces risk for investors, allowing firms to raise capital more cheaply." },
    { q: "A 'Dealer' in the financial market:", options: ["A. Only matches buyers/sellers", "B. Trades on their own account as a principal", "C. Never takes a risk", "D. Is always the government"], correct: 1, exp: "Dealers hold inventory and take risks, unlike brokers who only facilitate." },
    { q: "Under Purchasing Power Parity (PPP), exchange rates are determined by:", options: ["A. Relative interest rates", "B. Relative inflation rates", "C. Relative stock prices", "D. Gold reserves"], correct: 1, exp: "PPP suggests exchange rate changes offset differences in inflation between countries." },
    { q: "Which of the following is a 'Direct' financing method?", options: ["A. Taking a bank loan", "B. Issuing commercial paper to an investor", "C. Depositing in a credit union", "D. Buying a life insurance policy"], correct: 1, exp: "Direct financing bypasses intermediaries; the borrower deals directly with the lender." },
    { q: "Commercial Paper is usually issued by:", options: ["A. Small retail shops", "B. Highly rated large corporations", "C. The central bank", "D. Individuals"], correct: 1, exp: "Commercial paper is an unsecured, short-term debt instrument for high-quality firms." },
    { q: "The 'interbank market' is where:", options: ["A. Customers deposit money", "B. Banks lend to and borrow from each other", "C. Banks sell groceries", "D. The ASX operates"], correct: 1, exp: "Banks manage their daily liquidity needs by trading with each other." },
    { q: "A 'Promissory Note' is an example of:", options: ["A. Long-term equity", "B. Short-term debt", "C. A government tax", "D. A type of insurance"], correct: 1, exp: "It is a written promise to pay a specified sum at a future date." },
    { q: "The secondary market is important because it provides:", options: ["A. New capital for firms", "B. Price discovery and liquidity", "C. Free shares to employees", "D. Regulation of the RBA"], correct: 1, exp: "Without a secondary market, investors would be reluctant to buy in the primary market." },

    // --- MODULE 2: THEORY & CALCULATIONS (Questions 31-100) ---
    { q: "What is 'Time Value of Money'?", options: ["A. Time > Money", "B. $1 today > $1 in future", "C. Cost of a watch", "D. Work rate"], correct: 1, exp: "Money can earn interest, making current funds more valuable than future funds." },
    { q: "A 'Sunk Cost' should be:", options: ["A. In NPV", "B. In Payback", "C. Ignored", "D. Capitalized"], correct: 2, exp: "Sunk costs are past costs that don't change regardless of the decision." },
    { q: "If NPV is zero, the project:", options: ["A. Rejected", "B. Earns required rate of return", "C. Loses money", "D. No risk"], correct: 1, exp: "An NPV of zero means inflows cover the cost of capital and investment." },
    { q: "IRR is the discount rate that makes:", options: ["A. NPV=1", "B. NPV=0", "C. Profitable", "D. Short payback"], correct: 1, exp: "IRR is the break-even discount rate where PV of inflows equals outlay." },
    { q: "Systematic risk is risk that:", options: ["A. Diversifiable", "B. Company-specific", "C. Market-wide/Non-diversifiable", "D. Management caused"], correct: 2, exp: "Systematic risk affects all firms (e.g., inflation, interest rates)." },
    { q: "Unsystematic risk is reduced by:", options: ["A. One stock", "B. Diversification", "C. Bonds only", "D. Prediction"], correct: 1, exp: "Holding varied assets cancels out company-specific risks." },
    { q: "A Beta of 1.0 means:", options: ["A. No risk", "B. Twice risky", "C. Moves with market", "D. Bank-like"], correct: 2, exp: "A beta of 1.0 indicates the security moves with the market average." },
    { q: "Weak Form Efficiency rejects:", options: ["A. Insider info", "B. Public news", "C. Technical Analysis", "D. Financial statements"], correct: 2, exp: "Weak form says past price data is already reflected in the current price." },
    { q: "Semi-Strong Form Efficiency reflects:", options: ["A. Past prices only", "B. All public info", "C. All info (inc. private)", "D. CEO opinions"], correct: 1, exp: "Prices react instantly to news like earnings or dividends." },
    { q: "CAPM calculates:", options: ["A. Total risk", "B. Expected return (systematic risk)", "C. Max share price", "D. Dividend yield"], correct: 1, exp: "CAPM defines required return for a specific level of market risk." },
    { q: "An 'Opportunity Cost' is:", options: ["A. Past cost", "B. Benefit foregone", "C. Loan interest", "D. Hiring cost"], correct: 1, exp: "It is the value of the next best alternative given up." },
    { q: "Depreciation is excluded from NPV because:", options: ["A. Too small", "B. Non-cash expense", "C. Sunk cost", "D. Paid to gov"], correct: 1, exp: "NPV only considers cash flows. (Tax shields are separate)." },
    { q: "An 'Annuity' is:", options: ["A. Random", "B. Equal payments at regular intervals", "C. Growing payments", "D. One-off"], correct: 1, exp: "Examples include rent or insurance premiums." },
    { q: "A 'Perpetuity' is equal payments that:", options: ["A. Last 10 years", "B. Start in 10 years", "C. Continue forever", "D. Government-only"], correct: 2, exp: "A perpetuity has no end date." },
    { q: "Security Market Line (SML) plots return against:", options: ["A. Total Risk", "B. Unsystematic Risk", "C. Systematic Risk (Beta)", "D. Std Dev"], correct: 2, exp: "The SML visualizes the CAPM." },
    { q: "What is 'Compounding'?", options: ["A. Finding PV", "B. Interest on principal and interest", "C. Reducing risk", "D. Issuing debt"], correct: 1, exp: "Compounding moves money forward in time." },
    { q: "A 'Risk-Free' asset has a Beta of:", options: ["A. 1.0", "B. -1.0", "C. 0", "D. 0.5"], correct: 2, exp: "T-bills have no sensitivity to market movements." },
    { q: "The 'Market Risk Premium' is:", options: ["A. Rf", "B. Rm + Rf", "C. Rm - Rf", "D. Total risk"], correct: 2, exp: "Extra return demanded for market risk over safe investment." },
    { q: "Increasing debt (leverage) usually:", options: ["A. Decreases Beta", "B. Stays same", "C. Increases Beta", "D. Zeroes Beta"], correct: 2, exp: "Higher debt increases financial risk to equity holders." },
    { q: "Efficient Frontier portfolios:", options: ["A. Lowest risk", "B. Max return for given risk", "C. Bonds only", "D. Computer managed"], correct: 1, exp: "Shows the best possible risk-return trade-off." },
    { q: "PV of $1,000 in 3 years at 10%?", options: ["A. $751.31", "B. $826.45", "C. $909.09", "D. $1,331.00"], correct: 0, exp: "1000 / (1.10)^3 = 751.31" },
    { q: "FV of $500 for 2 years at 8%?", options: ["A. $580.00", "B. $583.20", "C. $540.00", "D. $600.00"], correct: 1, exp: "500 * (1.08)^2 = 583.20" },
    { q: "PV of annuity $200 for 4 years at 5%?", options: ["A. $800.00", "B. $709.19", "C. $744.65", "D. $680.20"], correct: 1, exp: "200 * [(1 - 1.05^-4)/0.05] = 709.19" },
    { q: "Value of perpetuity paying $50 at 8%?", options: ["A. $400.00", "B. $625.00", "C. $500.00", "D. $4,000.00"], correct: 1, exp: "50 / 0.08 = 625" },
    { q: "EAR for 12% compounded quarterly?", options: ["A. 12.00%", "B. 12.36%", "C. 12.55%", "D. 12.68%"], correct: 2, exp: "(1 + 0.12/4)^4 - 1 = 12.55%" },
    { q: "CAPM: Rf=4%, Rm=10%, Beta=1.5. Return?", options: ["A. 15%", "B. 13%", "C. 9%", "D. 19%"], correct: 1, exp: "4 + 1.5(10 - 4) = 13%" },
    { q: "Ex-Rights Price: 1-for-5 at $2.00. Current $5.00.", options: ["A. $3.50", "B. $4.50", "C. $4.00", "D. $2.50"], correct: 1, exp: "[(5*5)+(1*2)]/6 = 4.50" },
    { q: "Beta 1.2. Market rises 5%. Stock should rise:", options: ["A. 5.0%", "B. 1.2%", "C. 6.0%", "D. 7.2%"], correct: 2, exp: "1.2 * 5% = 6.0%" },
    { q: "IRR: Cost $100, returns $115 in 1 year.", options: ["A. 10%", "B. 15%", "C. 5%", "D. 115%"], correct: 1, exp: "Return is 15% over cost." },
    { q: "PV of $1,000 in 5 years at 0% interest?", options: ["A. $0", "B. $1,000", "C. $500", "D. $5,000"], correct: 1, exp: "0% interest means value doesn't change." },
    { q: "Bond Price: Par $100, Coupon 10%, Yield 10%.", options: ["A. $90", "B. $110", "C. $100", "D. $105"], correct: 2, exp: "Coupon = Yield, trades at Par." },
    { q: "Nominal 7%, Inflation 3%. Real Rate?", options: ["A. 10%", "B. 4%", "C. 2.33%", "D. 21%"], correct: 1, exp: "7% - 3% = 4%" },
    { q: "D1=$2.00, G=5%, R=10%. Price?", options: ["A. $20", "B. $40", "C. $21", "D. $10"], correct: 1, exp: "2.00 / (0.10 - 0.05) = 40" },
    { q: "Portfolio Beta: 60% Market, 40% Risk-free.", options: ["A. 1.0", "B. 0.6", "C. 0.4", "D. 0.5"], correct: 1, exp: "(0.6*1) + (0.4*0) = 0.6" },
    { q: "$100 bond trades at $95. Coupon rate is likely:", options: ["A. Equal to yield", "B. Higher than yield", "C. Lower than yield", "D. 0%"], correct: 2, exp: "Discount bonds have coupons below yield." },
    { q: "Payback: Cost $1,000. Cash flows $400/year.", options: ["A. 2 years", "B. 2.5 years", "C. 3 years", "D. 4 years"], correct: 1, exp: "1000 / 400 = 2.5" },
    { q: "Value of Right: TERP $4.50, Issue $3.00.", options: ["A. $1.50", "B. $7.50", "C. $0.75", "D. $1.00"], correct: 0, exp: "4.50 - 3.00 = 1.50" },
    { q: "Current Ratio: Assets $500, Liabilities $250.", options: ["A. 0.5", "B. 2.0", "C. 1.0", "D. 750"], correct: 1, exp: "500 / 250 = 2.0" },
    { q: "Std Dev of 0% means the asset is:", options: ["A. Market", "B. Risky", "C. Risk-free", "D. Inefficient"], correct: 2, exp: "No uncertainty means no risk." },
    { q: "Rule of 72: Double money at 6%?", options: ["A. 6 years", "B. 10 years", "C. 12 years", "D. 72 years"], correct: 2, exp: "72 / 6 = 12" },
    { q: "PV of $2,000 in 5 years at 4%?", options: ["A. $1,643.85", "B. $1,500.00", "C. $1,700.00", "D. $2,433.30"], correct: 0, exp: "2000 / (1.04)^5 = 1643.85" },
    { q: "FV of $1,000 in 10 years at 7%?", options: ["A. $1,700", "B. $1,967.15", "C. $2,100", "D. $1,500"], correct: 1, exp: "1000 * (1.07)^10 = 1967.15" },
    { q: "Price of perpetuity paying $100 at 5%?", options: ["A. $2,000", "B. $1,000", "C. $5,000", "D. $500"], correct: 0, exp: "100 / 0.05 = 2000" },
    { q: "CAPM: Rf=3%, Rm=9%, Beta=0.8. Return?", options: ["A. 7.8%", "B. 10.2%", "C. 6.0%", "D. 12.0%"], correct: 0, exp: "3 + 0.8(9 - 3) = 7.8%" },
    { q: "PV of $500/year for 3 years at 6%?", options: ["A. $1,336.51", "B. $1,500", "C. $1,200", "D. $1,400"], correct: 0, exp: "500 * [(1 - 1.06^-3)/0.06] = 1336.51" },
    { q: "EAR for 8% compounded semi-annually?", options: ["A. 8.00%", "B. 8.16%", "C. 8.24%", "D. 8.08%"], correct: 1, exp: "(1 + 0.04)^2 - 1 = 8.16%" },
    { q: "Beta of 2.0 means the stock is:", options: ["A. Half as risky as market", "B. Twice as risky as market", "C. Risk-free", "D. Negatively correlated"], correct: 1, exp: "Beta > 1 means higher systematic risk." },
    { q: "Project: Inflow $120 in 1 yr, Outlay $100. NPV at 10%?", options: ["A. $9.09", "B. $20.00", "C. $10.00", "D. $0.00"], correct: 0, exp: "(120 / 1.1) - 100 = 9.09" },
    { q: "If inflation increases, the SML will:", options: ["A. Shift up", "B. Shift down", "C. Become flatter", "D. Not move"], correct: 0, exp: "Inflation increases Rf, shifting the whole line up." },
    { q: "If investors become more risk-averse, the SML will:", options: ["A. Shift down", "B. Become steeper", "C. Become flatter", "D. Disappear"], correct: 1, exp: "Higher risk aversion increases the market risk premium (slope)." },
    { q: "A 90-day bank bill is sold at a discount. This is a:", options: ["A. Capital market instrument", "B. Money market instrument", "C. Long-term debt", "D. Equity"], correct: 1, exp: "Bank bills are short-term money market tools." },
    { q: "Diversification eliminates:", options: ["A. Systematic risk", "B. Total risk", "C. Unsystematic risk", "D. Market risk"], correct: 2, exp: "Diversification only removes company-specific (unsystematic) risk." },
    { q: "Profitability Index = PV of Inflows / Outlay. If PI > 1:", options: ["A. NPV is negative", "B. NPV is positive", "C. IRR < Cost of Capital", "D. Reject project"], correct: 1, exp: "PI > 1 means the project creates value (Positive NPV)." },
    { q: "Strong Form Efficiency implies prices reflect:", options: ["A. Public info only", "B. Past prices only", "C. All public and private info", "D. Random noise"], correct: 2, exp: "Strong form covers everything, even insider secrets." },
    { q: "Real rate 5%, Nominal 8%. Inflation is approx:", options: ["A. 13%", "B. 3%", "C. 1.6%", "D. 40%"], correct: 1, exp: "8% - 5% = 3%" },
    { q: "Beta of a market portfolio is always:", options: ["A. 0", "B. 1.0", "C. 0.5", "D. Variable"], correct: 1, exp: "The market is the benchmark, so its beta is 1.0." },
    { q: "Agency Problem refers to conflict between:", options: ["A. Buyers and Sellers", "B. Managers and Shareholders", "C. RBA and ASIC", "D. Banks and APRA"], correct: 1, exp: "Managers might act in their own interest rather than owners'." },
    { q: "Primary goal of financial management:", options: ["A. Maximize profit", "B. Maximize market share", "C. Maximize shareholder wealth", "D. Minimize tax"], correct: 2, exp: "Wealth maximization accounts for risk and time value, unlike simple profit." },
    { q: "Treasury Notes in Australia are:", options: ["A. Long-term bonds", "B. Short-term gov debt", "C. Private company debt", "D. Bank deposits"], correct: 1, exp: "T-Notes are short-term money market instruments issued by the government." },
    { q: "Secondary market for shares in Australia is primarily:", options: ["A. RBA", "B. ASX", "C. APRA", "D. ASIC"], correct: 1, exp: "The ASX is the main secondary exchange." },
    { q: "Semi-strong efficiency makes which analysis useless?", options: ["A. Fundamental Analysis", "B. Technical Analysis", "C. Both A and B", "D. Neither"], correct: 2, exp: "Since both past prices and public info are priced in, neither analysis earns abnormal returns." },
    { q: "Beta = 0.5. If market falls 10%, stock should:", options: ["A. Fall 10%", "B. Fall 5%", "C. Rise 5%", "D. Stay same"], correct: 1, exp: "0.5 * -10% = -5%" },
    { q: "Annuity Due payments are made at:", options: ["A. End of period", "B. Start of period", "C. Middle of period", "D. Never"], correct: 1, exp: "Annuity Due starts at the beginning; Ordinary Annuity at the end." },
    { q: "Which is a 'Capital Rationing' situation?", options: ["A. Too much cash", "B. Limited funds for investment", "C. High interest rates", "D. Low share price"], correct: 1, exp: "Rationing occurs when a firm can't fund all positive NPV projects." },
    { q: "Standard Deviation measures:", options: ["A. Systematic risk", "B. Total risk", "C. Market risk", "D. Beta"], correct: 1, exp: "Total risk (both systematic and unsystematic) is measured by standard deviation." },
    { q: "Required return = 10%. Project IRR = 12%. Result?", options: ["A. Accept", "B. Reject", "C. Indifferent", "D. Need more info"], correct: 0, exp: "Accept if IRR > Required Return." },
    { q: "A 'Debenture' is usually:", options: ["A. Unsecured debt", "B. Debt secured by a floating charge", "C. Equity", "D. A short-term bill"], correct: 1, exp: "In Australia, debentures are long-term debt secured by company assets." },
    { q: "Franking Credits relate to:", options: ["A. Corporate debt", "B. Tax already paid by company on dividends", "C. International trade", "D. Bank fees"], correct: 1, exp: "They prevent double taxation of dividends for Australian residents." },
    { q: "Which is a 'Direct' tax?", options: ["A. GST", "B. Income Tax", "C. Customs Duty", "D. Excise"], correct: 1, exp: "Direct taxes are paid directly by the entity earning the income." },
    { q: "Final Question: The CPA Business Finance exam focuses on:", options: ["A. Historical dates", "B. Shareholder wealth and decision making", "C. Marketing strategies", "D. Hiring staff"], correct: 1, exp: "The core is financial decision-making to create value." }
];

let current = 0;
let score = 0;
let answered = Array(questions.length).fill(false);

const qEl = document.getElementById("question");
const optEl = document.getElementById("options");
const expEl = document.getElementById("explanation");
const progress = document.getElementById("progress");

function loadQuestion() {
    let q = questions[current];
    qEl.innerText = `${current + 1}. ${q.q}`;
    optEl.innerHTML = "";
    expEl.style.display = "none";

    q.options.forEach((opt, i) => {
        let div = document.createElement("div");
        div.classList.add("option");
        div.innerText = opt;

        div.onclick = () => selectOption(i, div);
        optEl.appendChild(div);
    });

    updateProgress();
}

function selectOption(i, div) {
    if (answered[current]) return;

    answered[current] = true;

    let q = questions[current];
    let options = document.querySelectorAll(".option");

    if (i === q.correct) {
        div.classList.add("correct");
        score++;
    } else {
        div.classList.add("incorrect");
        options[q.correct].classList.add("correct");
    }

    expEl.innerText = "Explanation: " + q.exp;
    expEl.style.display = "block";
}

function updateProgress() {
    let percent = ((current) / questions.length) * 100;
    progress.style.width = percent + "%";
}

document.getElementById("nextBtn").onclick = () => {
    if (current < questions.length - 1) {
        current++;
        loadQuestion();
    } else {
        showResult();
    }
};

document.getElementById("prevBtn").onclick = () => {
    if (current > 0) {
        current--;
        loadQuestion();
    }
};

function showResult() {
    document.getElementById("quiz-box").style.display = "none";
    let result = document.getElementById("result");
    result.style.display = "block";
    result.innerHTML = `
        <h2>Your Score: ${score} / ${questions.length}</h2>
        <button onclick="location.reload()">Restart Quiz</button>
    `;
}

loadQuestion();
</script>

</body>
</html>
